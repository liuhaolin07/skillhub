name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: ruff check src tests
      - run: node --check src/skillhub/static/app.js

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - name: Verify wheel contents
        run: |
          python -m zipfile -l dist/*.whl | grep 'skillhub/static/index.html'
          python -m zipfile -l dist/*.whl | grep 'skillhub/static/app.css'
          python -m zipfile -l dist/*.whl | grep 'skillhub/static/security.css'
          python -m zipfile -l dist/*.whl | grep 'skillhub/static/app.js'

  verify:
    if: always()
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
