[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-skillhub"
version = "0.2.0"
description = "A local-first control plane for discovering, securing and managing Agent Skills across Hermes, Codex, Claude Code and ZCode."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Liu Haolin" }]
keywords = ["agent", "skills", "security", "hermes", "codex", "claude-code", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["PyYAML>=6.0.1"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
skillhub = "skillhub.app:main"

[project.urls]
Homepage = "https://github.com/liuhaolin07/skillhub"
Repository = "https://github.com/liuhaolin07/skillhub"
Issues = "https://github.com/liuhaolin07/skillhub/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillhub = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
